version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint 8.65 supports TypeScript versions below 6.1 only.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/ml/profile-qa"
    schedule:
      interval: weekly
    # The exporter uses a separate, intentionally incompatible Transformers/Hub lane.
    exclude-paths:
      - "requirements-export.txt"
      - "requirements-export.lock"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
