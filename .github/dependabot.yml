version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Match the Node.js 24 runtime selected by .nvmrc.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Keep the TypeScript API compatibility alias on 6 while parser/Next need it.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/ml/profile-qa"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Preserve newer packaging tag v0.11.0.1-1; allow future ShellCheck tags.
      - dependency-name: "https://github.com/shellcheck-py/shellcheck-py"
        versions: ["0.11.0.1"]
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
