name: Lint

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Record hook environment
        run: python -m pip freeze --local

      - name: Run Pre-Commits
        run: pre-commit run --show-diff-on-failure --color=always --all-files --hook-stage pre-commit
