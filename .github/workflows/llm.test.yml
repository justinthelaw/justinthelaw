name: Profile-QA Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/llm.test.yml"
      - "llm/**"
      - "src/config/public-profile.json"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: profile-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv==0.13.1

      - name: Verify Manifest-to-Lock Consistency
        run: |
          uv pip compile --python-version 3.14 --generate-hashes \
            --output-file llm/requirements.lock \
            llm/requirements.txt
          uv pip compile --python-version 3.14 --generate-hashes \
            --output-file llm/requirements-export.lock \
            llm/requirements-export.txt
          git diff --exit-code -- \
            llm/requirements.lock \
            llm/requirements-export.lock

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Test Runner
        run: python -m pip install pytest==9.1.1

      - name: Run Profile-QA Unit Tests
        run: PYTHONPATH=. python -m pytest llm/tests

  training-dependency-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv==0.13.1

      - name: Recreate Locked Training Environment
        run: |
          uv venv llm/.venv
          uv pip sync --python llm/.venv --require-hashes llm/requirements.lock

      - name: Check Training Dependency Graph and Imports
        run: |
          uv pip check --python llm/.venv
          llm/.venv/bin/python - <<'PY'
          import accelerate
          import bitsandbytes
          import datasets
          import huggingface_hub
          import onnx
          import onnxruntime
          import onnxscript
          import peft
          import pytest
          import safetensors
          import sentencepiece
          import torch
          import transformers
          from inspect import signature
          from transformers import Seq2SeqTrainer

          assert "processing_class" in signature(Seq2SeqTrainer).parameters
          print("Profile-QA dependency imports passed")
          PY

      - name: Audit Locked Training Dependencies
        run: uvx pip-audit==2.10.1 -r llm/requirements.lock

      - name: Run Profile-QA Test Suite
        run: PYTHONPATH=. llm/.venv/bin/python -m pytest llm/tests

  exporter-dependency-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install uv==0.13.1

      - name: Recreate Locked Exporter Environment
        run: |
          uv venv llm/.venv-export
          uv pip sync --python llm/.venv-export --require-hashes llm/requirements-export.lock

      - name: Check Exporter Dependency Graph and Imports
        run: |
          uv pip check --python llm/.venv-export
          PYTHONPATH=. llm/.venv-export/bin/python - <<'PY'
          import huggingface_hub
          import onnx
          import onnxruntime
          import onnxscript
          import safetensors
          import sentencepiece
          import torch
          import transformers
          from llm.persona.native_t5_onnx import export_t5

          print("Profile-QA exporter imports passed")
          PY

      - name: Audit Locked Exporter Dependencies
        run: uvx pip-audit==2.10.1 -r llm/requirements-export.lock

      - name: Install Test Runner
        run: uv pip install --python llm/.venv-export pytest==9.1.1

      - name: Verify Native Exporter Contract Offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          PYTHONPATH=. llm/.venv-export/bin/python \
            -m pytest llm/tests/test_native_export.py
