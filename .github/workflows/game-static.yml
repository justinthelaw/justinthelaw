name: Game Static Checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "games/pokemon-dungeon-reimagined/**"
      - "tools/pokemon-dungeon/**"
      - ".github/workflows/game-static.yml"
      - ".nvmrc"

concurrency:
  group: game-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/pokemon-dungeon/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@12.2.0
      - name: Install isolated authoring dependencies
        working-directory: tools/pokemon-dungeon
        run: npm ci --ignore-scripts
      - name: Check source types and static assets
        working-directory: tools/pokemon-dungeon
        run: npm run check
      - name: Fetch pinned comparative source for text audits
        run: |
          git fetch --no-tags --depth=1 origin efe20598c424cb09873dbc1def9aad9f7fe97d44
          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/pret/pmd-red.git "$RUNNER_TEMP/pokemon-native-source"
          git -C "$RUNNER_TEMP/pokemon-native-source" fetch --no-tags --depth=1 origin 6bcbec4f906938c0243aa2026bcbd41b577bab85
          git -C "$RUNNER_TEMP/pokemon-native-source" update-ref --no-deref HEAD 6bcbec4f906938c0243aa2026bcbd41b577bab85
      - name: Authenticate recovered source owners without game execution
        working-directory: tools/pokemon-dungeon
        run: |
          npm run sinister-run-preparation:check -- --native-root "$RUNNER_TEMP/pokemon-native-source"
          npm run sinister-cache-source:check -- --native-source "$RUNNER_TEMP/pokemon-native-source"
          npm run sinister-cache64:check -- --native-source "$RUNNER_TEMP/pokemon-native-source"
          npm run sinister-roster-domain:check -- --native-root "$RUNNER_TEMP/pokemon-native-source"
          npm run sinister-initial-ai:check -- --native-root "$RUNNER_TEMP/pokemon-native-source" --negative-controls
          npm run sinister-end:check -- --native-root "$RUNNER_TEMP/pokemon-native-source" --negative-controls
          npm run sinister-native-slots:check -- --native-root "$RUNNER_TEMP/pokemon-native-source"
