name: Game Static Checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "games/pokemon-dungeon-reimagined/**"
      - "tools/pokemon-dungeon/**"
      - ".github/workflows/game-static.yml"
      - ".nvmrc"

concurrency:
  group: game-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/pokemon-dungeon/package-lock.json
      - name: Install pinned npm
        run: npm install --global npm@12.2.1
      - name: Install isolated authoring dependencies
        working-directory: tools/pokemon-dungeon
        run: npm ci --ignore-scripts
      - name: Check source types and static assets
        working-directory: tools/pokemon-dungeon
        run: npm run check
