name: Deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - .nvmrc
      - src/**
      - public/**
      - games/**
      - scripts/export-games.mjs
      - "*.json"
      - "*.ts"
      - "*.mjs"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Package Manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            {
              echo "manager=yarn"
              echo "command=install"
              echo "runner=yarn"
            } >> "$GITHUB_OUTPUT"
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            {
              echo "manager=npm"
              echo "command=ci"
              echo "runner=npx --no-install"
            } >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12.2.0

      - name: Setup Pages
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          static_site_generator: next

      - name: Install Dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Lint Code
        run: ${{ steps.detect-package-manager.outputs.manager }} run lint

      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.manager }} run build

      - name: Install Playwright Browsers
        run: ${{ steps.detect-package-manager.outputs.runner }} playwright install --with-deps

      - name: Run Playwright Tests
        run: ${{ steps.detect-package-manager.outputs.runner }} playwright test

      - name: Archive Pages artifact
        run: |
          tar --dereference --hard-dereference --directory out \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github --exclude='.[^/]*' .

      - name: Upload Artifact
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
