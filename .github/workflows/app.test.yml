name: Playwright Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

concurrency:
  group: app-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm 12
        run: npm install --global npm@12.2.0

      - name: Install Dependencies
        # Match Pages builds: browser inference needs no native CUDA download.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      - name: Check Complete Lockfile Dependency Graph
        run: npm ls --all --package-lock-only

      - name: Build project
        run: npm run build

      - name: Lint Code
        run: npm run lint

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Pages Preview
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-preview-${{ github.sha }}
          path: out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload Test Artifacts
        # Bundled runtime fixes await upstream; see docs/dependency-upgrades/2026-10-12.md.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30
